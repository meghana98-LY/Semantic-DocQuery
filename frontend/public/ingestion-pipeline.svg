<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 228" width="1140" height="228">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#3d4f82"/>
    </marker>
    <style>text { font-family: 'Segoe UI', Arial, sans-serif; }</style>
  </defs>
  <rect width="1140" height="228" fill="#ffffff"/>
  <rect x="14" y="16" width="1112" height="196" rx="8" fill="#eef1f9" stroke="#c6cfe8" stroke-width="1.5"/>
  <text x="570" y="46" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a2e">Document Ingestion Pipeline</text>

  <!-- [1] User PDF Upload -->
  <rect x="22" y="95" width="108" height="54" rx="5" fill="#dce4f5" stroke="#3d4f82" stroke-width="1.5"/>
  <text x="76" y="118" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1a1a2e">User,</text>
  <text x="76" y="132" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1a1a2e">PDF Upload</text>
  <line x1="130" y1="122" x2="150" y2="122" stroke="#3d4f82" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- [2] Security Validation -->
  <rect x="152" y="95" width="130" height="54" rx="5" fill="#dce4f5" stroke="#3d4f82" stroke-width="1.5"/>
  <text x="217" y="115" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1a1a2e">Security</text>
  <text x="217" y="129" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1a1a2e">Validation</text>
  <text x="217" y="143" text-anchor="middle" font-size="9" fill="#3a4e7a">(MIME · Size · Magic)</text>
  <line x1="282" y1="122" x2="302" y2="122" stroke="#3d4f82" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- [3] Text Extraction -->
  <rect x="304" y="95" width="148" height="54" rx="5" fill="#dce4f5" stroke="#3d4f82" stroke-width="1.5"/>
  <text x="378" y="115" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1a1a2e">Text Extraction</text>
  <text x="378" y="130" text-anchor="middle" font-size="10" fill="#3a4e7a">(PyMuPDF + OCR)</text>
  <line x1="452" y1="122" x2="472" y2="122" stroke="#3d4f82" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- [4] Chunking Module -->
  <rect x="474" y="95" width="128" height="54" rx="5" fill="#dce4f5" stroke="#3d4f82" stroke-width="1.5"/>
  <text x="538" y="115" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1a1a2e">Chunking</text>
  <text x="538" y="129" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1a1a2e">Module</text>
  <text x="538" y="143" text-anchor="middle" font-size="9" fill="#3a4e7a">(Sentence-boundary)</text>
  <line x1="602" y1="122" x2="622" y2="122" stroke="#3d4f82" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- [5] Embedding + BM25 -->
  <rect x="624" y="95" width="155" height="54" rx="5" fill="#dce4f5" stroke="#3d4f82" stroke-width="1.5"/>
  <text x="701" y="115" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1a1a2e">Embedding + BM25</text>
  <text x="701" y="130" text-anchor="middle" font-size="10" fill="#3a4e7a">(MiniLM + tsvector)</text>
  <line x1="779" y1="122" x2="810" y2="122" stroke="#3d4f82" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- [6] Vector Database cylinder -->
  <rect x="832" y="106" width="136" height="50" fill="#dce4f5" stroke="#3d4f82" stroke-width="1.5"/>
  <ellipse cx="900" cy="156" rx="68" ry="12" fill="#dce4f5" stroke="none"/>
  <path d="M 832,156 A 68,12 0 0,0 968,156" fill="none" stroke="#3d4f82" stroke-width="1.5"/>
  <ellipse cx="900" cy="106" rx="68" ry="12" fill="#dce4f5" stroke="#3d4f82" stroke-width="1.5"/>
  <text x="900" y="131" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a2e">Vector Database</text>
  <text x="900" y="148" text-anchor="middle" font-size="10" font-weight="500" fill="#1a1a2e">(pgvector · BM25)</text>
</svg>
