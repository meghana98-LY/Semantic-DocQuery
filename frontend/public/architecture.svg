<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 660" width="1140" height="660">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#3d4f82"/>
    </marker>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; }
    </style>
  </defs>

  <!-- ─── Background ─── -->
  <rect width="1140" height="660" fill="#ffffff"/>

  <!-- ════════════════════════════════════════════════════════════ -->
  <!--  DOCUMENT INGESTION PIPELINE                               -->
  <!-- ════════════════════════════════════════════════════════════ -->
  <rect x="14" y="16" width="1112" height="196" rx="8" fill="#eef1f9" stroke="#c6cfe8" stroke-width="1.5"/>

  <text x="570" y="46" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a2e">Document Ingestion Pipeline</text>

  <!-- center_y = 122, box height = 54 → top = 95, bottom = 149 -->

  <!-- [1] User, PDF Upload  x=30, w=112 -->
  <rect x="30"  y="95" width="112" height="54" rx="5" fill="#dce4f5" stroke="#3d4f82" stroke-width="1.5"/>
  <text x="86"  y="118" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1a1a2e">User,</text>
  <text x="86"  y="132" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1a1a2e">PDF Upload</text>

  <line x1="142" y1="122" x2="166" y2="122" stroke="#3d4f82" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- [2] PDF Ingestion  x=168, w=112 -->
  <rect x="168" y="95" width="112" height="54" rx="5" fill="#dce4f5" stroke="#3d4f82" stroke-width="1.5"/>
  <text x="224" y="118" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1a1a2e">PDF</text>
  <text x="224" y="132" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1a1a2e">Ingestion</text>

  <line x1="280" y1="122" x2="304" y2="122" stroke="#3d4f82" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- [3] Text Extraction  x=306, w=152 -->
  <rect x="306" y="95" width="152" height="54" rx="5" fill="#dce4f5" stroke="#3d4f82" stroke-width="1.5"/>
  <text x="382" y="115" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1a1a2e">Text Extraction</text>
  <text x="382" y="130" text-anchor="middle" font-size="10"   fill="#3a4e7a">(PyMuPDF + OCR)</text>

  <line x1="458" y1="122" x2="482" y2="122" stroke="#3d4f82" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- [4] Chunking Module  x=484, w=132 -->
  <rect x="484" y="95" width="132" height="54" rx="5" fill="#dce4f5" stroke="#3d4f82" stroke-width="1.5"/>
  <text x="550" y="118" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1a1a2e">Chunking</text>
  <text x="550" y="132" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1a1a2e">Module</text>

  <line x1="616" y1="122" x2="640" y2="122" stroke="#3d4f82" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- [5] Embedding Model  x=642, w=162 -->
  <rect x="642" y="95" width="162" height="54" rx="5" fill="#dce4f5" stroke="#3d4f82" stroke-width="1.5"/>
  <text x="723" y="115" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1a1a2e">Embedding Model</text>
  <text x="723" y="130" text-anchor="middle" font-size="10"   fill="#3a4e7a">(all-MiniLM-L6-v2)</text>

  <line x1="804" y1="122" x2="840" y2="122" stroke="#3d4f82" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- [6] Vector Database – cylinder -->
  <rect   x="862" y="106" width="136" height="50" fill="#dce4f5" stroke="#3d4f82" stroke-width="1.5"/>
  <ellipse cx="930" cy="156" rx="68" ry="12"      fill="#dce4f5" stroke="none"/>
  <path   d="M 862,156 A 68,12 0 0,0 998,156"      fill="none" stroke="#3d4f82" stroke-width="1.5"/>
  <ellipse cx="930" cy="106" rx="68" ry="12"      fill="#dce4f5" stroke="#3d4f82" stroke-width="1.5"/>
  <text x="930" y="135" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a2e">Vector Database</text>
  <text x="930" y="152" text-anchor="middle" font-size="10" font-weight="500" fill="#1a1a2e">(pgvector)</text>


  <!-- ════════════════════════════════════════════════════════════ -->
  <!--  QUERY PROCESSING PIPELINE                                 -->
  <!-- ════════════════════════════════════════════════════════════ -->
  <rect x="14" y="232" width="1112" height="408" rx="8" fill="#eef1f9" stroke="#c6cfe8" stroke-width="1.5"/>

  <text x="570" y="262" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a2e">Query Processing Pipeline</text>

  <!-- ── ROW 1  center_y=348, height=54, top=321, bottom=375 ── -->

  <!-- [1] User Query  x=30, w=90 -->
  <rect x="30"  y="321" width="90"  height="54" rx="5" fill="#dce4f5" stroke="#3d4f82" stroke-width="1.5"/>
  <text x="75"  y="344" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1a1a2e">User</text>
  <text x="75"  y="358" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1a1a2e">Query</text>

  <line x1="120" y1="348" x2="200" y2="348" stroke="#3d4f82" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- [2] Auth / Session Management  x=202, w=150 -->
  <rect x="202" y="321" width="150" height="54" rx="5" fill="#dce4f5" stroke="#3d4f82" stroke-width="1.5"/>
  <text x="277" y="341" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1a1a2e">Auth / Session</text>
  <text x="277" y="355" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1a1a2e">Management</text>

  <line x1="352" y1="348" x2="430" y2="348" stroke="#3d4f82" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- [3] Query Router  x=432, w=112 -->
  <rect x="432" y="321" width="112" height="54" rx="5" fill="#dce4f5" stroke="#3d4f82" stroke-width="1.5"/>
  <text x="488" y="344" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1a1a2e">Query</text>
  <text x="488" y="358" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1a1a2e">Router</text>

  <line x1="544" y1="348" x2="622" y2="348" stroke="#3d4f82" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- [4] Embedding Model  x=624, w=160 -->
  <rect x="624" y="321" width="160" height="54" rx="5" fill="#dce4f5" stroke="#3d4f82" stroke-width="1.5"/>
  <text x="704" y="341" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1a1a2e">Embedding Model</text>
  <text x="704" y="355" text-anchor="middle" font-size="10"   fill="#3a4e7a">(all-MiniLM-L6-v2)</text>

  <!-- Arrow 4→5 with label -->
  <line x1="784" y1="348" x2="862" y2="348" stroke="#3d4f82" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="823" y="340" text-anchor="middle" font-size="8.5" fill="#5a6a9a">Query Vector</text>

  <!-- [5] Vector Database (pgvector) – cylinder -->
  <rect   x="864" y="321" width="184" height="58" fill="#dce4f5" stroke="#3d4f82" stroke-width="1.5"/>
  <ellipse cx="956" cy="379" rx="92" ry="14"      fill="#dce4f5" stroke="none"/>
  <path   d="M 864,379 A 92,14 0 0,0 1048,379"      fill="none" stroke="#3d4f82" stroke-width="1.5"/>
  <ellipse cx="956" cy="321" rx="92" ry="14"      fill="#dce4f5" stroke="#3d4f82" stroke-width="1.5"/>
  <text x="956" y="354" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a2e">Vector Database (pgvector)</text>
  <text x="956" y="372" text-anchor="middle" font-size="10" font-weight="500" fill="#1a1a2e">Cosine Similarity Search</text>

  <!-- ── Vertical+horizontal connector: VDB bottom → Answer Gen ── -->
  <path d="M 956 393 L 956 430 L 570 430 L 570 468"
        stroke="#3d4f82" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="766" y="423" text-anchor="middle" font-size="8.5" fill="#5a6a9a">Retrieved Chunks</text>

  <!-- ── ROW 2  center_y=505, height=60, top=475, bottom=535 ── -->

  <!-- [A] Answer Generation Module (key module – bolder border) center_x=570 -->
  <rect x="446" y="468" width="248" height="60" rx="5" fill="#c4d0f2" stroke="#2c3e7a" stroke-width="2.2"/>
  <text x="570" y="491" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1a1a2e">Answer Generation Module</text>
  <text x="570" y="507" text-anchor="middle" font-size="9.5"  fill="#2d3e70">Factual Extract / Generative Summary</text>

  <line x1="694" y1="498" x2="732" y2="498" stroke="#3d4f82" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- [B] Formatted Answer + Source Cards  x=734, w=192 -->
  <rect x="734" y="468" width="192" height="60" rx="5" fill="#dce4f5" stroke="#3d4f82" stroke-width="1.5"/>
  <text x="830" y="491" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1a1a2e">Formatted Answer</text>
  <text x="830" y="506" text-anchor="middle" font-size="10"   fill="#3a4e7a">+ Source Cards</text>

  <line x1="926" y1="498" x2="962" y2="498" stroke="#3d4f82" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- [C] User (receives answer)  x=964, w=82 -->
  <rect x="964" y="468" width="82" height="60" rx="5" fill="#dce4f5" stroke="#3d4f82" stroke-width="1.5"/>
  <text x="1005" y="502" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1a1a2e">User</text>

</svg>
